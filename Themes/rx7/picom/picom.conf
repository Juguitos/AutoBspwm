# ─── RX7 Theme · Picom ───────────────────────────────────────────────────────
backend          = "glx";
vsync            = true;
corner-radius    = 6;
use-damage       = true;

shadow           = false;
fading           = true;
fade-in-step     = 0.04;
fade-out-step    = 0.04;

inactive-opacity         = 0.95;
active-opacity           = 1.0;

opacity-rule = [
    "92:class_g = 'kitty' && focused",
    "88:class_g = 'kitty' && !focused",
    "95:class_g = 'Rofi'",
    "100:class_g = 'firefox'",
    "100:class_g = 'Burp Suite'"
];

blur-method      = "dual_kawase";
blur-strength    = 4;
blur-background  = false;

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'"
];

rounded-corners-exclude = [
    "window_type = 'dock'",
    "class_g = 'Polybar'"
];

mark-wmwin-focused    = true;
detect-rounded-corners = true;
detect-client-opacity  = true;
log-level = "warn";

wintypes: {
    tooltip = { fade = true; shadow = false; opacity = 0.9; };
    dock    = { shadow = false; };
    popup_menu  = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
};
