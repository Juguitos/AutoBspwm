# ─── RX7 Theme · Kitty ───────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

cursor_shape           block
cursor_blink_interval  0
scrollback_lines       10000
window_padding_width   8
background_opacity     0.92
confirm_os_window_close 0

tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    " {index}: {title} "

# Colores HTB
foreground            #c0caf5
background            #0D0D0D
selection_foreground  #0D0D0D
selection_background  #63CC00

color0   #1a1a2e
color8   #414868
color1   #CC0063
color9   #f7768e
color2   #63CC00
color10  #00CC04
color3   #e0af68
color11  #ff9e64
color4   #7aa2f7
color12  #2ac3de
color5   #6900CC
color13  #bb9af7
color6   #00CC69
color14  #73daca
color7   #c0caf5
color15  #ffffff

active_tab_foreground   #0D0D0D
active_tab_background   #63CC00
inactive_tab_foreground #545c7e
inactive_tab_background #1a1a2e
tab_bar_background      #0D0D0D

map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+enter  new_window_with_cwd
map ctrl+shift+minus  launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+h      neighboring_window left
map ctrl+shift+l      neighboring_window right
map ctrl+shift+k      neighboring_window up
map ctrl+shift+j      neighboring_window down
map ctrl+shift+equal  change_font_size all +1.0
map ctrl+shift+0      change_font_size all 0
