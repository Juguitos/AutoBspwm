# ─── RX7 Theme · Polybar ─────────────────────────────────────────────────────

[colors]
bg       = #cc0D0D0D
bg-solid = #0D0D0D
bg2      = #1a1a2e
fg       = #c0caf5
fg-dim   = #545c7e
green    = #63CC00
green2   = #00CC04
teal     = #00CC69
purple   = #6900CC
pink     = #CC0063
gray     = #414868

[bar/main]
width            = 100%
height           = 28
radius           = 0
fixed-center     = true
background       = ${colors.bg}
foreground       = ${colors.fg}
line-size        = 2
line-color       = ${colors.green}
border-size      = 0
padding-left     = 1
padding-right    = 1
module-margin    = 0
font-0 = "JetBrainsMono Nerd Font:size=9;2"
font-1 = "Font Awesome 6 Free:style=Solid:size=9;2"
font-2 = "Font Awesome 6 Brands:size=9;2"
modules-left   = bspwm sep target
modules-center = date
modules-right  = vpn sep ip sep network sep cpu sep memory sep pulseaudio sep
tray-position   = right
tray-padding    = 4
tray-background = ${colors.bg-solid}
cursor-click    = pointer
enable-ipc      = true
wm-restack      = bspwm

[module/sep]
type            = custom/text
content         = " | "
content-foreground = ${colors.gray}

[module/bspwm]
type = internal/bspwm
label-focused             = %index%
label-focused-foreground  = ${colors.bg}
label-focused-background  = ${colors.green}
label-focused-padding     = 2
label-occupied            = %index%
label-occupied-foreground = ${colors.teal}
label-occupied-padding    = 2
label-urgent              = %index%
label-urgent-foreground   = ${colors.pink}
label-urgent-padding      = 2
label-empty               = %index%
label-empty-foreground    = ${colors.gray}
label-empty-padding       = 2

[module/date]
type     = internal/date
interval = 1
date     = "%a %d %b"
time     = "%H:%M:%S"
format-prefix          = " "
format-prefix-foreground = ${colors.teal}
label          = %date%  %time%
label-foreground = ${colors.green}

[module/target]
type     = custom/script
exec     = ~/.config/polybar/scripts/target.sh
interval = 2
click-left  = ~/.config/polybar/scripts/target.sh copyip
click-right = ~/.config/polybar/scripts/target.sh clear
label            = %output%
label-foreground = ${colors.green}

[module/cpu]
type             = internal/cpu
interval         = 1
format-prefix          = " CPU "
format-prefix-foreground = ${colors.purple}
label            = %percentage:2%%

[module/memory]
type             = internal/memory
interval         = 2
format-prefix          = " MEM "
format-prefix-foreground = ${colors.teal}
label            = %percentage_used%%

[module/network]
type             = internal/network
interface-type   = wireless
interval         = 2
format-connected-prefix   = "󰤨 "
format-connected-prefix-foreground = ${colors.green2}
label-connected           = %essid%
format-disconnected-prefix   = "󰤭 "
format-disconnected-prefix-foreground = ${colors.pink}
label-disconnected           = offline
label-disconnected-foreground = ${colors.pink}

[module/ip]
type     = custom/script
exec     = ip -4 a show scope global 2>/dev/null | grep -oP '(?<=inet\s)\d+(\.\d+){3}' | grep -v '10\.10\.' | head -1 || echo "no ip"
interval = 5
format-prefix          = " "
format-prefix-foreground = ${colors.teal}

[module/vpn]
type     = custom/script
exec     = ~/.config/polybar/scripts/vpn.sh
interval = 3
label-foreground = ${colors.green}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix   = " "
format-volume-prefix-foreground = ${colors.purple}
label-volume          = %percentage%%
label-muted           = 󰝟 muted
label-muted-foreground = ${colors.gray}
click-right = pavucontrol &
